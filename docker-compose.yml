name: magi

services:
    ollama:
        image: ollama/ollama
        profiles: ["all", "api"]
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/ollama-init.sh"]
        environment:
            OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
            OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
        volumes:
            - ollama:/root/.ollama
            - ./docker/ollama-init.sh:/ollama-init.sh:ro

    api:
        profiles: ["all", "api"]
        restart: unless-stopped
        init: true
        build:
            context: .
            dockerfile: docker/Dockerfile.api
        depends_on:
            - ollama
        ports:
            - "${API_PORT:-5050}:${API_PORT:-5050}"
        environment:
            API_PORT: ${API_PORT:-5050}
            MAGI_DATA_DIR: /data
            OLLAMA_URL: http://ollama:11434
            OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
            OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
            OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-131072}
            WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v2}
            WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-fr}
            WHISPERX_DEVICE: ${WHISPERX_DEVICE:-cpu}
            WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-int8}
            HF_TOKEN: ${HF_TOKEN:-}
        volumes:
            - magi-data:/data
            - whisperx-cache:/root/.cache

    dashboard:
        profiles: ["all", "dashboard"]
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/Dockerfile.dashboard
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${DASHBOARD_PORT:-5000}:${DASHBOARD_PORT:-5000}"
        environment:
            TZ: Europe/Paris
            DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
            MAGI_NODE_URL: http://localhost:${API_PORT:-5050}
            MAGI_HOST_GATEWAY: host.docker.internal

volumes:
    magi-data:
    ollama:
    whisperx-cache:
