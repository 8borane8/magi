name: magi

services:
    ollama:
        image: ollama/ollama
        profiles: ["all", "api"]
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/ollama-init.sh"]
        environment:
            OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
            OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
        volumes:
            - ollama:/root/.ollama
            - ./docker/ollama-init.sh:/ollama-init.sh:ro
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    api:
        profiles: ["all", "api"]
        restart: unless-stopped
        init: true
        build:
            context: .
            dockerfile: docker/Dockerfile.api
        depends_on:
            - ollama
        ports:
            - "${API_PORT:-5050}:${API_PORT:-5050}"
        environment:
            API_PORT: ${API_PORT:-5050}
            MAGI_DATA_DIR: /data
            OLLAMA_URL: http://ollama:11434
            OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
            OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
            WHISPERX_BIN: whisperx
            WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v2}
            WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-fr}
            WHISPERX_DEVICE: ${WHISPERX_DEVICE:-cuda}
            WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
        volumes:
            - magi-data:/data
            - whisperx-cache:/root/.cache
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    dashboard:
        profiles: ["all", "dashboard"]
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/Dockerfile.dashboard
        ports:
            - "${DASHBOARD_PORT:-5000}:${DASHBOARD_PORT:-5000}"
        environment:
            DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}

volumes:
    magi-data:
    ollama:
    whisperx-cache:
